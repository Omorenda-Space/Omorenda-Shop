name: Build Omorendashop - Backend

on:
  push:
    tags:
      - '*'
    branches:
      - main
env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          cd Backend
          # Omorendashop backend
          docker build \
            -t ghcr.io/omorendaspace/omorendashop-be:${{ env.IMAGE_TAG }} .

          
      - name: Push Docker image
        run: |
          docker push ghcr.io/omorendaspace/omorendashop-be:${{ env.IMAGE_TAG }}
