name: Deploy to Vercel - shop.omorenda.space

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
    branches:
      - main
    # paths:
    #   - "vercel_trigger.txt"

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Frontend

    env:
      NODE_VERSION: 24
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Strip Git metadata for Vercel
        run: rm -rf .git
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      
      - name: Verify Node.js and npm
        run: |
          node --version
          npm --version

      
      - name: Generate .env file
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
        run: |
          echo "$BASE64_ENV" | base64 --decode > .env

      
      - name: Install dependencies
        run: npm ci

      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      
      - name: Verify Vercel configuration
        run: |
          echo "Vercel Org ID is configured: ${VERCEL_ORG_ID:+yes}"
          echo "Vercel Project ID is configured: ${VERCEL_PROJECT_ID:+yes}"
          vercel --version
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      
      - name: Pull Production Environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      
      - name: Build Production
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

     
      - name: Deploy Production
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      
      - name: Show Deployment Info
        run: |
          echo "========================================"
          echo "Production deployment completed"
          echo "========================================"
          echo "Tag: $GITHUB_REF_NAME"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Vercel: $(vercel --version)"
          echo "========================================"
